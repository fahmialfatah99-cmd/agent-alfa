name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: "Ruff check - gate bug nyata (F/E/B006)"
        run: ruff check .

  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mypy
        run: pip install mypy
      - name: Run type checking on core modules
        run: |
          mypy --ignore-missing-imports alfa/ || echo "Type checking completed with warnings"
      - name: Enforce mypy error budget (must not grow)
        run: |
          count=$(mypy --ignore-missing-imports alfa/ 2>&1 | grep -c ": error:" || true)
          baseline=$(cat .github/mypy-baseline.txt)
          echo "mypy errors: $count (budget: $baseline)"
          test "$count" -le "$baseline"

  security:
    name: Security (pip-audit, bandit, gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependency vulnerability scan
        # PYSEC-2026-3740 (nltk, unpatched upstream) is an unused transitive
        # dep of Crawl4AI; everything else must be clean or this job fails.
        run: |
          pip install pip-audit
          pip install -r requirements.txt || true
          pip-audit --ignore-vuln PYSEC-2026-3740
      - name: Static security scan (bandit, medium+)
        run: |
          pip install bandit
          bandit -r alfa plugins -ll
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Nilai dummy: modul wajib punya kunci di env saat impor,
      # tidak ada panggilan jaringan di unit test.
      TELEGRAM_BOT_TOKEN: "000000000:CI_DUMMY_TOKEN"
      GEMINI_API_KEY: "CI_DUMMY_KEY"
      ALLOWED_USER_IDS: "123456789"
      OWNER_NAME: "CI Runner"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies lengkap (best-effort)
        run: pip install -r requirements.txt || true
      - name: Pastikan dependensi inti terpasang
        run: |
          pip install python-telegram-bot google-genai python-dotenv \
            aiosqlite psutil httpx fastapi uvicorn pillow pypdf tabulate \
            pytest pytest-cov pytest-asyncio cryptography numpy
      - name: Jalankan seluruh suite dengan coverage
        run: pytest -v --cov=alfa --cov=. --cov-report=xml --cov-report=html
      - name: Upload coverage report
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload HTML coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 7
