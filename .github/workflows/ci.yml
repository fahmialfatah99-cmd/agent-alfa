name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff==0.16.4" # sertakan agar gate deterministik lintas-tahun
      - name: "Ruff check - gate bug nyata (F/E/B/W/I/N/UP/YTT + TRY/BLE budget)"
        run: ruff check .
      - name: Enforce TRY/BLE lint budget (must not grow)
        run: python scripts/lint_budget.py --check

  docs:
    name: Docs (mkdocs strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install mkdocs
        run: pip install "mkdocs==1.6.1" "mkdocs-material==9.7.7"
      - name: Cek salinan dokumen sinkron
        run: python scripts/build_docs.py --check
      - name: Build strict
        run: mkdocs build --strict

  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install mypy
        run: pip install "mypy==1.8.0" # disematkan ke pre-commit; latest (2.x) jauh lebih ketat
      - name: Run type checking on core modules
        run: |
          mypy --ignore-missing-imports alfa/ || echo "Type checking completed with warnings"
      - name: Enforce mypy error budget (must not grow)
        run: |
          count=$(mypy --ignore-missing-imports alfa/ 2>&1 | grep -c ": error:" || true)
          baseline=$(cat .github/mypy-baseline.txt)
          echo "mypy errors: $count (budget: $baseline)"
          test "$count" -le "$baseline"

  security:
    name: Security (pip-audit, bandit, gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Dependency vulnerability scan
        # PYSEC-2026-3740 (nltk, unpatched upstream) is an unused transitive
        # dep of Crawl4AI; everything else must be clean or this job fails.
        run: |
          pip install pip-audit
          pip install -r requirements.txt || true
          pip-audit --ignore-vuln PYSEC-2026-3740
      - name: Static security scan (bandit, medium+)
        run: |
          pip install "bandit==1.9.4"
          bandit -r alfa plugins -ll
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  evals:
    name: Evals (offline tool-routing)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: "000000000:CI_DUMMY_TOKEN"
      GEMINI_API_KEY: "CI_DUMMY_KEY"
      ALLOWED_USER_IDS: "123456789"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (best-effort)
        run: pip install -r requirements.txt || true
      - name: Pastikan dependensi inti terpasang
        run: |
          pip install python-telegram-bot google-genai python-dotenv \
            aiosqlite psutil httpx fastapi uvicorn pillow pypdf tabulate \
            numpy pydantic click rich pyyaml jinja2 aiofiles websockets \
            cryptography pygments ddgs
      - name: Offline eval gate (20+ skenario, tanpa LLM)
        run: python evals/run_evals.py

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Nilai dummy: modul wajib punya kunci di env saat impor,
      # tidak ada panggilan jaringan di unit test.
      TELEGRAM_BOT_TOKEN: "000000000:CI_DUMMY_TOKEN"
      GEMINI_API_KEY: "CI_DUMMY_KEY"
      ALLOWED_USER_IDS: "123456789"
      OWNER_NAME: "CI Runner"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies lengkap (best-effort)
        run: pip install -r requirements.txt || true
      - name: Pastikan dependensi inti terpasang
        run: |
          pip install python-telegram-bot google-genai python-dotenv \
            aiosqlite psutil httpx fastapi uvicorn pillow pypdf tabulate \
            "pytest==9.1.1" "pytest-cov==7.1.0" "pytest-asyncio==1.4.0" \
            cryptography numpy pydantic click rich pyyaml jinja2 \
            aiofiles websockets pygments ddgs \
            python-multipart requests webauthn
      - name: Jalankan seluruh suite dengan coverage (threshold gate)
        # Threshold dinaikkan dari 44% ke 50% (terukur 51.62% per 2026-10-19).
        run: pytest -v --cov=alfa --cov=. --cov-report=xml --cov-report=html --cov-fail-under=50
      - name: Determinism sentinel (2x back-to-back without cacheprovider)
        run: |
          pytest tests -p no:cacheprovider -q
          pytest tests -p no:cacheprovider -q
      - name: Upload coverage report
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload HTML coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 7
