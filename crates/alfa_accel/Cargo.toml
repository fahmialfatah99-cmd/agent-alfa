[package]
name = "alfa_accel"
version = "0.1.0"
edition = "2021"

[lib]
name = "alfa_accel"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["extension-module"] }
fancy-regex = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
