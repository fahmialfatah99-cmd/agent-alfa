[package]
name = "alfa_accel"
version = "0.1.0"
edition = "2021"
description = "Native Rust acceleration for ALFA OS (PyO3)"
license = "MIT"
authors = ["Fahmi Alfatah <fahmialfatah99@example.com>"]

[lib]
name = "alfa_accel"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["extension-module"] }
fancy-regex = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Jangan pakai panic = "abort": PyO3 perlu unwind agar panic Rust menjadi
# PanicException, bukan mematikan seluruh proses Python (service 24/7).
strip = true
