# ==============================================================================
# ALFA Sovereign AI - Docker Compose Production Stack
# ==============================================================================
services:
  alfa-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alfa_dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    environment:
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=8080
      - DASHBOARD_AUTH_TOKEN=${DASHBOARD_AUTH_TOKEN:-}
      - SESSION_SECRET=${SESSION_SECRET:-alfa_sovereign_secure_key}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OWNER_NAME=${OWNER_NAME:-Pemilik}
    volumes:
      - ./agent_data.db:/app/agent_data.db
      - ./alfa_projects:/home/alfa/alfa_projects
      - ./Dokumen:/home/alfa/Dokumen
      - sandbox_data:/dev/shm/alfa_sandbox
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - alfa_net

  alfa-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alfa_telegram_bot
    restart: unless-stopped
    command: ["python3", "bot.py"]
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
      - OWNER_NAME=${OWNER_NAME:-Pemilik}
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS:-}
      - DASHBOARD_AUTH_TOKEN=${DASHBOARD_AUTH_TOKEN:-}
    volumes:
      - ./agent_data.db:/app/agent_data.db
      - ./alfa_projects:/home/alfa/alfa_projects
      - ./Dokumen:/home/alfa/Dokumen
      - sandbox_data:/dev/shm/alfa_sandbox
    depends_on:
      - alfa-dashboard
    networks:
      - alfa_net

volumes:
  sandbox_data:

networks:
  alfa_net:
    driver: bridge
