[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alfa-ai"
version = "3.5.0"
description = "ALFA Sovereign AI Agent - Unified, Modular AI Agent Architecture"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Fahmi Alfatah", email = "fahmialfatah99@example.com"}
]
keywords = ["ai", "agent", "llm", "automation", "cli", "swarm", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent"
]
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot>=20.0",
    "google-genai",
    "python-dotenv",
    "aiosqlite",
    "psutil",
    "httpx",
    "requests>=2.31.0,<3.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "fastapi",
    "uvicorn",
    "pillow",
    "pypdf",
    "tabulate",
    "numpy",
    "pydantic",
    "click",
    "rich",
    "pyyaml",
    "jinja2",
    "aiofiles",
    "websockets",
    "cryptography",
    "requests>=2.31.0,<3.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "defusedxml>=0.7.0,<1.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "inquirerpy>=0.3.4,<1.0.0",
    "google-api-python-client>=2.100.0,<3.0.0",
    "google-auth-oauthlib>=1.2.0,<2.0.0",
    "webauthn>=3.0,<4",
    "pygments"
]

[project.optional-dependencies]
ml = [
    "sentence-transformers"
]
affiliate = [
    # Niche e-commerce promo stack (optional, 0% coverage core)
]
video = [
    # Promo video generation stack (optional)
]
academic = [
    # Academic paper research (optional)
]
scraping-extra = [
    "scrapy",
    "crawlee",
    "crawl4ai",
    "scrapling",
    "firecrawl-py",
]
full = [
    "alfa-ai[ml,affiliate,video,academic,scraping-extra]"
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio",
    "black",
    "ruff",
    "mypy",
    "flake8",
    "pre-commit"
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings"
]

[project.scripts]
alfa = "alfa.cli:main"
alfa-cli = "alfa.cli:main"
alfa-agent = "alfa.bot.telegram_bot:main"
alfa-mcp = "alfa.mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["alfa*", "plugins*"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | __pycache__
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [".git", ".venv", "venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "B", "W", "I", "N", "UP", "YTT", "TRY", "BLE"]
ignore = ["E501", "B006"]

[tool.ruff.lint.per-file-ignores]
